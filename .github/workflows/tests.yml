name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Arch Linux (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Builds tests/Dockerfile and runs every scenario in a fresh container.
      - run: ./tests/run.sh

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # run-macos.sh skips the package installs (scenario 0 only dry-runs
      # them), so the tools it needs must already be on the runner. brew's
      # ansible bundles community.general for the homebrew modules.
      - name: Install prerequisites
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ansible stow
      - run: ./tests/run-macos.sh
