- name: Installing Stow on Debian
  become: true
  apt:
    name: stow
    state: present
  when: ansible_facts["os_family"] == "Debian"
  tags:
    - install
    - dotfiles
    - stow
- name: Installing Stow on arch
  become: true
  pacman:
    name: stow
    state: present
  when: ansible_facts["os_family"] == "Archlinux"
  tags:
    - install
    - dotfiles
    - stow
- name: Cloning dotfiles
  ansible.builtin.git:
    repo: git@github.com:pinnheads/dotfiles.git
    dest: "{{ lookup('env', 'HOME') }}/.dotfiles"
    recursive: yes
    update: yes
    accept_hostkey: yes
    version: main
  tags:
    - install
    - dotfiles
    - stow
- name: Stow dotfiles
  shell: cd $HOME/.dotfiles && ./stow
  tags:
    - install
    - dotfiles
    - stow
