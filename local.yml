- hosts: localhost
  gather_facts: yes

  pre_tasks:
    - name: Update apt
      become: true
      apt:
        force_apt_get: yes
        update_cache: yes
        state: present
      when: ansible_facts["os_family"] == "Debian"
      tags:
        - node
        - zsh
        - ssh
        - docker
        - dotfiles
        - productivity

    - name: Update pacman and upgrade
      become: true
      pacman:
        update_cache: true
        upgrade: yes
      when: ansible_facts["os_family"] == "Archlinux"
      tags:
        - node
        - zsh
        - ssh
        - docker
        - dotfiles
        - productivity

  vars:
    source_key: "./.ssh/id_rsa"
    dest_key: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa"

  tasks:
    - include_tasks:
        file: tasks/zsh.yml
      tags:
        - zsh
    - include_tasks:
        file: tasks/node.yml
      tags:
        - node
    - include_tasks:
        file: tasks/productivity-tools.yml
      tags:
        - productivity
        - install
    - include_tasks:
        file: tasks/ssh.yml
      tags:
        - ssh
        - dotfiles
        - install
    - include_tasks:
        file: tasks/dotfiles.yml
      tags:
        - dotfiles
        - install
    - include_tasks:
        file: tasks/debian/nvim-setup.yml
      when: ansible_facts["os_family"] == "Debian"
      tags:
        - install
        - nvim
        - neovim
    - include_tasks:
        file: tasks/debian/alacritty-install.yml
      when: ansible_facts["os_family"] == "Debian"
      tags:
        - install
        - alacritty
    - include_tasks:
        file: tasks/debian/docker.yml
      when: ansible_facts["os_family"] == "Debian"
      tags:
        - docker
        - install
    - include_tasks:
        file: tasks/font.yml
      tags:
        - font
        - install
