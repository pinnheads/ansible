- hosts: localhost
  pre_tasks:
    - name: Update packages
      become: true
      pacman:
        update_cache: true
      when: ansible_facts["os_family"] == "Archlinux"
      tags:
        - pkg-update
        - ssh
        - dev-dotfiles
        - zsh
        - dev
    # Homebrew refuses to run as root, so no become here.
    - name: Update Homebrew
      community.general.homebrew:
        update_homebrew: true
      when: ansible_facts["os_family"] == "Darwin"
      tags:
        - pkg-update
        - ssh
        - dev-dotfiles
        - zsh
        - dev
  vars:
    source_key: "./.ssh/id_rsa"
    dest_key: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa"
    # macOS ships zsh at /bin/zsh; Arch's pacman package installs /usr/bin/zsh.
    zsh_path: "{{ '/bin/zsh' if ansible_facts['os_family'] == 'Darwin' else '/usr/bin/zsh' }}"
  tasks:
    - include_tasks:
        file: tasks/dev-tools.yml
      tags:
        - dev-tools
        - dev-dotfiles
        - projects
        - ssh
        - zsh
        - dev
    - include_tasks:
        file: tasks/ssh.yml
      tags:
        - ssh
        - projects
        - dev
    - include_tasks:
        file: tasks/zsh.yml
      tags:
        - zsh
        - dev
    - include_tasks:
        file: tasks/dev-dotfiles.yml
      tags:
        - dev-dotfiles
        - dev
    - include_tasks:
        file: tasks/projects.yml
      tags:
        - projects
        - dev
